<header class="topbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2"/><circle cx="9" cy="8" r="2"/><circle cx="18" cy="5" r="2"/><path d="M6.6 17.2 8.4 9.9M10.8 7.4 16.2 5.6"/></svg>
    </div>
    <div class="brand-text">
      <h1>HEXAR</h1>
      <p>Control interface</p>
    </div>
  </div>

  <ul class="rail" aria-label="System status">
    <li class="pill"><span class="dot" id="systemDot"></span><span class="pill-label">Server</span><b id="systemStatus">Connecting…</b></li>
    <li class="pill"><span class="dot" id="arduinoDot"></span><span class="pill-label">Controller</span><b id="arduinoStatus">Disconnected</b></li>
    <li class="pill"><span class="dot" id="cameraDot"></span><span class="pill-label">Camera</span><b id="cameraStatus">Not connected</b></li>
    <li class="pill pill-mode"><span class="dot dot-warn"></span><span class="pill-label">Mode</span><b>Simulation</b></li>
  </ul>

  <button class="icon-btn theme-toggle" id="themeToggle" type="button" aria-label="Switch theme" title="Switch theme">
    <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>
