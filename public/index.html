<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0c1015">
  <title>Robotic Arm | Control HMI</title>

  <!-- <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"> -->

  <script>
    /* Set the theme before first paint so there is no light/dark flash. */
    (function () {
      var theme = "dark";
      try {
        var saved = localStorage.getItem("robotic-arm-theme");
        if (saved === "light" || saved === "dark") theme = saved;
        else if (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) theme = "light";
      } catch (e) {}
      document.documentElement.dataset.theme = theme;
    })();
  </script>

  <!-- Shared styles (order matters: tokens first) -->
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/layout.css">
  <link rel="stylesheet" href="/shared/components.css">

  <!-- One stylesheet per section. Edit only the one you are changing. -->
  <link rel="stylesheet" href="/sections/topbar/topbar.css">
  <link rel="stylesheet" href="/sections/twin/twin.css">
  <link rel="stylesheet" href="/sections/voice/voice.css">
  <link rel="stylesheet" href="/sections/joints/joints.css">
  <link rel="stylesheet" href="/sections/poses/poses.css">
  <link rel="stylesheet" href="/sections/safety/safety.css">
  <link rel="stylesheet" href="/sections/footer/footer.css">

  <script type="module" src="/main.js"></script>
</head>
<body>
  <noscript>This control interface needs JavaScript.</noscript>

  <!-- Each data-include is replaced by that section's HTML file (see main.js). -->
  <div data-include="/sections/topbar/topbar.html"></div>

  <main class="layout">
    <div data-include="/sections/twin/twin.html"></div>
    <div data-include="/sections/voice/voice.html"></div>
    <div data-include="/sections/joints/joints.html"></div>
    <div data-include="/sections/poses/poses.html"></div>
    <div data-include="/sections/safety/safety.html"></div>
  </main>

  <div data-include="/sections/footer/footer.html"></div>
</body>
</html>
