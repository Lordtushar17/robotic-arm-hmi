<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e13">
  <title>HEXAR | Control HMI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    /* Set the theme before first paint so there is no flash. */
    (function () {
      var theme = "dark";
      try {
        var saved = localStorage.getItem("robotic-arm-theme");
        if (saved === "light" || saved === "dark") theme = saved;
      } catch (e) {}
      document.documentElement.dataset.theme = theme;
    })();
  </script>

  <!-- Order matters: tokens first, then atmosphere, then base/components. -->
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/atmosphere.css">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/layout.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/rails.css">

  <link rel="stylesheet" href="/sections/topbar/topbar.css">
  <link rel="stylesheet" href="/sections/twin/twin.css">
  <link rel="stylesheet" href="/sections/voice/voice.css">
  <link rel="stylesheet" href="/sections/joints/joints.css">
  <link rel="stylesheet" href="/sections/poses/poses.css">
  <link rel="stylesheet" href="/sections/safety/safety.css">

  <script type="module" src="/main.js"></script>
</head>
<body>
  <noscript>This control interface needs JavaScript.</noscript>

  <div data-include="/shared/status-rail.html"></div>

  <main class="layout">
    <div data-include="/sections/twin/twin.html"></div>
    <div data-include="/sections/voice/voice.html"></div>
    <div data-include="/sections/joints/joints.html"></div>
    <div data-include="/sections/poses/poses.html"></div>
    <div data-include="/sections/safety/safety.html"></div>
  </main>

  <div data-include="/shared/event-rail.html"></div>
</body>
</html>
