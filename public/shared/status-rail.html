<header class="status-rail" role="banner">
  <div class="rail-brand">
    <span class="rail-led" id="railLed" data-state="online"></span>
    <span class="rail-label">ROBOTIC ARM · HMI</span>
    <span class="rail-divider"></span>
    <span class="rail-meta" id="railHost">local</span>
  </div>

  <div class="rail-scroll" aria-hidden="true">
    <span class="scan-line"></span>
  </div>

  <div class="rail-meta-group">
    <div class="rail-cell">
      <span class="rail-label">MODE</span>
      <span class="rail-value rail-value-amber" id="railMode">SIMULATION</span>
    </div>
    <div class="rail-cell">
      <span class="rail-label">UPTIME</span>
      <span class="rail-value num" id="railUptime">00:00:00</span>
    </div>
    <div class="rail-cell">
      <span class="rail-label">LOCAL</span>
      <span class="rail-value num" id="railClock">--:--:--</span>
    </div>
  </div>
</header>
